<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Opus 4.5 AI | MINATO TOOLS HUB</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/9d9jjj.jpg">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #7000ff;
            --bg-gradient: linear-gradient(135deg, #05070f 0%, #0a0e1a 100%);
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(0, 243, 255, 0.2);
            --accent-glow: linear-gradient(135deg, #00f3ff, #7000ff);
            --user-bubble: linear-gradient(135deg, #7000ff 0%, #00f3ff 100%);
            --ai-bubble: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Canvas Animation Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation Bar */
        nav {
            position: relative;
            z-index: 10;
            width: 100%;
            background: rgba(5, 7, 15, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            object-fit: cover;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(112, 0, 255, 0.15));
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Container & Workspace */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            height: 80vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 20px 28px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .brand-info h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .brand-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Chat Messages Box */
        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(0, 243, 255, 0.3);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-icon {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .message.ai .message-icon {
            background: var(--accent-glow);
            color: #fff;
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-content {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: #fff;
            font-weight: 500;
        }

        .message.ai .message-content {
            background: var(--ai-bubble);
            border: 1px solid var(--card-border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }

        /* Typing Indicator */
        .typing {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 12px 18px;
            background: var(--ai-bubble);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: var(--primary);
            border-radius: 50%;
            animation: blink 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* Input Area */
        .chat-input-area {
            padding: 18px 24px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--card-border);
        }

        .input-form {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            transition: border-color 0.3s ease;
        }

        .input-form:focus-within {
            border-color: var(--primary);
        }

        .input-form textarea {
            flex: 1;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            color: #ffffff !important;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: none;
            max-height: 120px;
            height: 24px;
            padding: 2px 0;
            display: block;
            width: 100%;
        }

        .input-form textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .send-btn {
            background: var(--accent-glow);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(5, 7, 15, 0.9);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .dev-highlight {
            color: var(--primary);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            nav { padding: 1rem; flex-direction: column; gap: 1rem; }
            .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; }
            .chat-container { height: 75vh; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Canvas Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html" class="nav-brand">
            <img src="https://files.catbox.moe/9d9jjj.jpg" alt="Logo" class="nav-logo">
            <span class="brand-title">MINATO HUB</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="gpt5.html" class="nav-btn"><i class="fa-solid fa-brain"></i> GPT-5</a></li>
            <li><a href="fluxv2.html" class="nav-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> Flux V2</a></li>
            <li><a href="opus.html" class="nav-btn active"><i class="fa-solid fa-microchip"></i> Opus</a></li>
            <li><a href="tools.html" class="nav-btn"><i class="fa-solid fa-toolbox"></i> All Tools</a></li>
        </ul>
    </nav>

    <!-- Chat Container Workspace -->
    <div class="main-wrapper">
        <div class="chat-container">
            <!-- Header -->
            <div class="chat-header">
                <div class="brand">
                    <div class="avatar-icon">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <div class="brand-info">
                        <h2>Claude Opus 4.5</h2>
                        <p>High Performance Reasoning Model</p>
                    </div>
                </div>
            </div>

            <!-- Chat Box -->
            <div class="chat-box" id="chatBox">
                <!-- Initial AI Welcome Message -->
                <div class="message ai">
                    <div class="message-icon"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">Hello! I am Claude Opus 4.5 AI. How can I assist you today?</div>
                </div>

                <!-- Typing Indicator Container -->
                <div class="typing" id="typingIndicator">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <form class="input-form" id="chatForm">
                    <textarea id="promptInput" rows="1" placeholder="Type your message here..." required></textarea>
                    <button type="submit" class="send-btn" id="sendBtn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 <span class="dev-highlight">MINATO TOOLS HUB</span>. Crafted & Maintained by <span class="dev-highlight">LORD MINATO</span>.</p>
    </footer>

    <script>
        const chatForm = document.getElementById('chatForm');
        const promptInput = document.getElementById('promptInput');
        const chatBox = document.getElementById('chatBox');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');

        // Auto-expand textarea
        promptInput.addEventListener('input', function() {
            this.style.height = '24px';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Submit on Enter (Shift+Enter for newline)
        promptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function appendMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const iconDiv = document.createElement('div');
            iconDiv.classList.add('message-icon');
            iconDiv.innerHTML = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.textContent = text;

            messageDiv.appendChild(iconDiv);
            messageDiv.appendChild(contentDiv);

            chatBox.insertBefore(messageDiv, typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Direct API Fetch inside Pure HTML/JS
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            // Render User Message
            appendMessage('user', prompt);
            promptInput.value = '';
            promptInput.style.height = '24px';

            // Disable input & show loading state
            sendBtn.disabled = true;
            typingIndicator.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const apiUrl = 'https://apis.davidcyril.name.ng/ai/claude-opus-4.5?prompt=' + encodeURIComponent(prompt);
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                let aiReply = '';
                if (typeof data === 'object' && data !== null) {
                    aiReply = data.data || data.result || data.response || data.message || data.content || 'No response received.';
                } else {
                    aiReply = data;
                }

                appendMessage('ai', aiReply);
            } catch (err) {
                appendMessage('ai', 'Error: Failed to fetch response from API endpoint.');
            } finally {
                typingIndicator.style.display = 'none';
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });

        // Particle Canvas Background Animation
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
