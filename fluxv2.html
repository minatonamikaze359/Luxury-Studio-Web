<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="ddbc39aa345ccc34fc5d2dce63768928">
    <title>FLUX AI Image Generator | MINATO TOOLS HUB</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://files.catbox.moe/a6xpxg.png">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #7000ff;
            --bg-gradient: linear-gradient(135deg, #05070f 0%, #0a0e1a 100%);
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(0, 243, 255, 0.2);
            --accent-glow: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Particle Canvas Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Navigation Bar */
        nav {
            position: relative;
            z-index: 10;
            width: 100%;
            background: rgba(5, 7, 15, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            object-fit: cover;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(112, 0, 255, 0.15));
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Container & Workspace */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 850px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .generator-container {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .header {
            padding: 20px 28px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .brand h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .content-body {
            padding: 30px 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            transition: border-color 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--primary);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
        }

        .generate-btn {
            background: var(--accent-glow);
            border: none;
            color: #000;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .generate-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .image-preview-box {
            width: 100%;
            min-height: 380px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--card-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            position: relative;
        }

        .result-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 12px;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .spinner {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #D4AF37;
        }

        .spinner i {
            font-size: 2.2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .error-box {
            display: none;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.9rem;
            margin-top: 10px;
            width: 100%;
            text-align: center;
        }

        .image-actions {
            display: none;
            justify-content: center;
            margin-top: 12px;
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 10px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: var(--accent-glow);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(5, 7, 15, 0.9);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .dev-highlight {
            color: var(--primary);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            nav { padding: 1rem; flex-direction: column; gap: 1rem; }
            .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; }
            .main-wrapper { padding: 20px 10px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Particle Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html" class="nav-brand">
            <img src="https://files.catbox.moe/9d9jjj.jpg" alt="Logo" class="nav-logo">
            <span class="brand-title">MINATO HUB</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="gpt5.html" class="nav-btn"><i class="fa-solid fa-brain"></i> GPT-5</a></li>
            <li><a href="fluxv2.html" class="nav-btn active"><i class="fa-solid fa-wand-magic-sparkles"></i> Flux V2</a></li>
            <li><a href="opus.html" class="nav-btn"><i class="fa-solid fa-microchip"></i> Opus</a></li>
            <li><a href="tools.html" class="nav-btn"><i class="fa-solid fa-toolbox"></i> All Tools</a></li>
        </ul>
    </nav>

    <!-- Main Container -->
    <div class="main-wrapper">
        <div class="generator-container">
            <div class="header">
                <div class="brand">
                    <div class="avatar-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                    <div>
                        <h2>FLUX AI Generator</h2>
                        <p style="font-size:0.8rem; color:var(--text-secondary);">High Performance Flux Engine</p>
                    </div>
                </div>
            </div>

            <div class="content-body">
                <form id="generateForm" class="input-group">
                    <input type="text" id="promptInput" placeholder="Describe your image prompt..." required>
                    <button type="submit" class="generate-btn" id="generateBtn">Generate</button>
                </form>

                <div class="image-preview-box">
                    <div id="placeholder" style="color:var(--text-secondary);">
                        <i class="fa-solid fa-image" style="font-size:2.5rem; color:#D4AF37;"></i>
                        <p style="margin-top:8px;">Your generated artwork will appear here</p>
                    </div>

                    <div class="spinner" id="spinner">
                        <i class="fa-solid fa-circle-notch"></i>
                        <p>Generating artwork with FLUX AI...</p>
                    </div>

                    <img src="" alt="Generated Artwork" class="result-image" id="resultImg">
                    <div class="error-box" id="errorBox"></div>
                </div>

                <div class="image-actions" id="imageActions">
                    <a href="#" download="flux-artwork.jpg" id="downloadBtn" class="download-btn">
                        <i class="fa-solid fa-download"></i> Download Artwork
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <span class="dev-highlight">MINATO TOOLS HUB</span>. Crafted & Maintained by <span class="dev-highlight">LORD MINATO</span>.</p>
    </footer>

    <script>
        const form = document.getElementById('generateForm');
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const placeholder = document.getElementById('placeholder');
        const spinner = document.getElementById('spinner');
        const resultImg = document.getElementById('resultImg');
        const errorBox = document.getElementById('errorBox');
        const imageActions = document.getElementById('imageActions');
        const downloadBtn = document.getElementById('downloadBtn');

        let lastAdTime = 0;
        const AD_COOLDOWN = 30000; // 30 seconds
        const MONETAG_DIRECT_LINK = "https://omg10.com/4/11541646";

        downloadBtn.addEventListener('click', function() {
            const now = Date.now();
            if (now - lastAdTime >= AD_COOLDOWN) {
                lastAdTime = now;
                window.open(MONETAG_DIRECT_LINK, '_blank');
            }
        });

        // Function to fetch image binary and turn it into Base64 via Canvas
        async function fetchImageAsBase64(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || img.width;
                    canvas.height = img.naturalHeight || img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    try {
                        const dataURL = canvas.toDataURL('image/jpeg');
                        resolve(dataURL);
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = () => reject(new Error('Failed to load image from remote server.'));
                img.src = url;
            });
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            generateBtn.disabled = true;
            placeholder.style.display = 'none';
            resultImg.style.display = 'none';
            errorBox.style.display = 'none';
            imageActions.style.display = 'none';
            spinner.style.display = 'flex';

            try {
                const seed = Math.floor(Math.random() * 900000) + 100000;
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=flux&seed=${seed}&width=1024&height=1024&nologo=true`;

                const base64Data = await fetchImageAsBase64(imageUrl);

                resultImg.src = base64Data;
                downloadBtn.href = base64Data;

                spinner.style.display = 'none';
                resultImg.style.display = 'block';
                imageActions.style.display = 'flex';
            } catch (err) {
                spinner.style.display = 'none';
                errorBox.textContent = err.message || 'Generation failed. Please try again.';
                errorBox.style.display = 'block';
            } finally {
                generateBtn.disabled = false;
            }
        });

        // Canvas Particle Background Animation
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
