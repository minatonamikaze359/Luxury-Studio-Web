<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-5 AI Engine - MINATO TOOLS HUB</title>
    <!-- Logo & Favicon -->
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/9d9jjj.jpg">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #7000ff;
            --accent: #ff0055;
            --bg-dark: #05070f;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-glow: rgba(0, 243, 255, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Particle Canvas Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient Glow Effects */
        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        .glow-1 { top: -100px; left: -100px; background: var(--primary); }
        .glow-2 { bottom: -100px; right: -100px; background: var(--secondary); }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 7, 15, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .nav-brand:hover .nav-logo {
            transform: rotate(360deg) scale(1.05);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            list-style: none;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(112, 0, 255, 0.15));
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Container & Workspace */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .workspace-box {
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tool-header i {
            font-size: 2rem;
            color: var(--primary);
        }

        .tool-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #fff;
        }

        .tool-input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
            resize: vertical;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
        }

        .output-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px dotted rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 150px;
            margin-top: 1.5rem;
            font-family: monospace;
            color: #a7f3d0;
            white-space: pre-wrap;
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(5, 7, 15, 0.9);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .dev-highlight {
            color: var(--primary);
            font-weight: 700;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            nav { padding: 1rem; flex-direction: column; gap: 1rem; }
            .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- Canvas Animation Background -->
    <canvas id="particle-canvas"></canvas>
    
    <!-- Ambient Blur Lights -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html" class="nav-brand">
            <img src="https://files.catbox.moe/9d9jjj.jpg" alt="Logo" class="nav-logo">
            <span class="brand-title">MINATO HUB</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="gpt5.html" class="nav-btn active"><i class="fa-solid fa-brain"></i> GPT-5</a></li>
            <li><a href="fluxv2.html" class="nav-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> Flux V2</a></li>
            <li><a href="opus.html" class="nav-btn"><i class="fa-solid fa-microchip"></i> Opus</a></li>
            <li><a href="tools.html" class="nav-btn"><i class="fa-solid fa-toolbox"></i> All Tools</a></li>
        </ul>
    </nav>

    <!-- Main Workspace -->
    <main class="container">
        <div class="workspace-box">
            <div class="tool-header">
                <i class="fa-solid fa-brain"></i>
                <div>
                    <h2>GPT-5 AI Engine</h2>
                    <p style="color: var(--text-muted);">Ultra-speed intelligence unit</p>
                </div>
            </div>
            <div class="tool-input-group">
                <textarea id="gpt5-input" rows="6" placeholder="Ask GPT-5 anything or input complex code..."></textarea>
                <div>
                    <button class="btn-action" onclick="runGPT5()"><i class="fa-solid fa-paper-plane"></i> Execute Query</button>
                </div>
            </div>
            <div class="output-box" id="gpt5-output">System status: Ready for query input...</div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 <span class="dev-highlight">MINATO TOOLS HUB</span>. Crafted & Maintained by <span class="dev-highlight">LORD MINATO</span>.</p>
    </footer>

    <!-- Interactive Scripts -->
    <script>
        // Execution Handler
        function runGPT5() {
            const input = document.getElementById('gpt5-input').value;
            const output = document.getElementById('gpt5-output');
            if(!input.trim()) return output.innerText = "Error: Input query cannot be empty.";
            
            output.innerText = "GPT-5 Processing...\n\n[Response from LORD MINATO Neural Node]:\nAnalyzing instruction: '" + input + "'\nDone. High precision data calculated successfully.";
        }

        // Particle Canvas Background Animation
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
